[package]
name = "vrcwatchdog-app"
version = "0.0.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Phase 5d: Tauri shell skeleton.
# - main.rs is a placeholder that boots Tauri with no plugins / no commands.
# - 起動順序 (plan §9) や IPC 配線は別 commit で積む。
# - cargo build -p vrcwatchdog-app と cargo tauri dev でウィンドウが立ち上がる
#   ところまでが本フェーズのゴール。

[lib]
name = "vrcwatchdog_app_lib"
path = "src/lib.rs"

[[bin]]
name = "vrcwatchdog"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri.conf.json の assetProtocol.enable=true (plan §7) に対応する feature flag。
# tauri-build はこの feature と conf の allowlist 一致を強制する。
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
# tauri-plugin-dialog: Settings 画面の folder picker (open dialog) で使う。
# capabilities/default.json に dialog:allow-open を追加した上で、JS から
# `@tauri-apps/plugin-dialog` の open() を呼び出す。
tauri-plugin-dialog = "2"
# tauri-plugin-opener は **Rust 側 `app.opener().open_path()` のために** だけ register
# する。capabilities/default.json では opener:* perm を意図的に外しており、JS から
# `invoke('plugin:opener|open_path', ...)` は呼べない (plan §7 を新 plugin で実装)。
# 原本写真の open は Rust の commands.rs が path traversal validation 後に呼ぶ唯一のパス。
# (旧 tauri-plugin-shell::Shell::open は Tauri 2.4 で deprecated → opener に分離された)
tauri-plugin-opener = "2"
vrcwatchdog-core = { path = "../core" }
tokio.workspace = true
sqlx.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
iana-time-zone.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
