<!doctype html>
<!-- class="dark" は Tailwind v4 の dark variant (`.dark, .dark *`) を有効化する。
     Phase 5d で全体 default-dark なので unconditionally 付与。settings.theme で切替えるのは Phase 7。 -->
<html lang="ja" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VRCWatchDog</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
